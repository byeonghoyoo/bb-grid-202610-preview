<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뷰티블라썸 2026년 10월 인스타 그리드</title>
<style>
  body{margin:0;background:#f6f1f4;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#3a2438}
  .wrap{max-width:1100px;margin:0 auto;padding:40px 20px 60px}
  h1{font-size:24px;margin:0 0 24px}
  h2{font-size:17px;margin:40px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#fff}
  .grid img{width:100%;display:block}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .cards figure{margin:0}
  .cards img{width:100%;display:block;border-radius:8px}
  .cards figcaption{font-size:14px;margin-top:8px;text-align:center}
  @media(max-width:700px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>뷰티블라썸 2026년 10월 인스타 그리드 피드</h1>
  <h2>피드 노출 화면</h2>
  <div class="grid">
    <img src="img/1.png" alt="1 로고">
    <img src="img/2.png" alt="2 10월 이벤트">
    <img src="img/3.png" alt="3 10월 진료일정">
  </div>
  <h2>개별 이미지</h2>
  <div class="cards">
    <figure><img src="img/1.png" alt=""><figcaption>1. 로고</figcaption></figure>
    <figure><img src="img/2.png" alt=""><figcaption>2. 10월 이벤트</figcaption></figure>
    <figure><img src="img/3.png" alt=""><figcaption>3. 10월 진료일정</figcaption></figure>
  </div>
</div>
</body>
</html>
